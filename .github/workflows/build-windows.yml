name: Build & Release Windows 11 Executable

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build RavenSpot.exe (Windows 11 x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Fetch LibreHardwareMonitor (CPU/GPU temps, GPU load)
        shell: pwsh
        run: ./tools/fetch_lhm.ps1

      - name: Flatten symlinks for Windows non-admin compatibility
        shell: python
        run: |
          import os, shutil
          flattened = 0
          removed = 0
          for root_dir in ("icons", "assets", "sounds"):
              if not os.path.isdir(root_dir):
                  continue
              for dirpath, dirnames, filenames in os.walk(root_dir, topdown=False):
                  for name in filenames + dirnames:
                      p = os.path.join(dirpath, name)
                      if os.path.islink(p):
                          target = os.path.realpath(p)
                          exists = os.path.exists(target)
                          is_file = os.path.isfile(target)
                          is_dir = os.path.isdir(target)
                          if os.path.isdir(p):
                              os.rmdir(p)
                          else:
                              os.unlink(p)
                          if exists and is_file:
                              shutil.copy2(target, p)
                              flattened += 1
                          elif exists and is_dir:
                              shutil.copytree(target, p, symlinks=False)
                              flattened += 1
                          else:
                              removed += 1
          remaining = [
              os.path.join(dp, n)
              for root_dir in ("icons", "assets", "sounds")
              if os.path.isdir(root_dir)
              for dp, dns, fns in os.walk(root_dir)
              for n in dns + fns
              if os.path.islink(os.path.join(dp, n))
          ]
          assert not remaining, f"Symlinks still exist: {remaining[:5]}"
          print(f"Symlinks flattened: {flattened}, broken removed: {removed}")

      - name: Build standalone executable with PyInstaller
        shell: cmd
        run: |
          pyinstaller --noconsole --onefile --name "RavenSpot" ^
            --hidden-import=win_platform ^
            --hidden-import=pycaw ^
            --hidden-import=pycaw.pycaw ^
            --hidden-import=comtypes ^
            --hidden-import=comtypes.stream ^
            --hidden-import=PySide6.QtSvg ^
            --hidden-import=PySide6.QtSvgWidgets ^
            --hidden-import=PySide6.QtNetwork ^
            --hidden-import=PySide6.QtMultimedia ^
            --add-data "Menu.qml;." ^
            --add-data "CommandOutputPanel.qml;." ^
            --add-data "OpenCloseAnimation.qml;." ^
            --add-data "ThemeGlyph.qml;." ^
            --add-data "MenuModel.js;." ^
            --add-data "menu.jsonc;." ^
            --add-data "menu_win.jsonc;." ^
            --add-data "themes.json;." ^
            --add-data "assets;assets" ^
            --add-data "sounds;sounds" ^
            --add-data "icons;icons" ^
            --add-data "lhm;lhm" ^
            --clean ^
            bridge.py

      - name: Verify build artifact
        shell: cmd
        run: |
          if not exist dist\RavenSpot.exe (
            echo "Error: dist\RavenSpot.exe was not created!"
            exit /b 1
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavenSpot-Windows-x64
          path: dist/RavenSpot.exe
          if-no-files-found: error

      - name: Package Release Zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/RavenSpot.exe, README.md, LICENSE, menu_win.jsonc, themes.json -DestinationPath RavenSpot-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            RavenSpot-Windows-x64.zip
            dist/RavenSpot.exe
          draft: false
          prerelease: false
          generate_release_notes: true
